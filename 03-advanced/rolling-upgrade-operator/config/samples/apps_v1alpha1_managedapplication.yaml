apiVersion: apps.example.com/v1alpha1
kind: ManagedApplication
metadata:
  name: my-app
  namespace: default
spec:
  deploymentName: my-app
  image: nginx
  version: "1.27"
  paused: false
  upgradeStrategy:
    type: Canary
    canary:
      enabled: true
      steps:
        - weight: 10
          pause: 60
        - weight: 50
          pause: 60
        - weight: 100
    healthCheck:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
