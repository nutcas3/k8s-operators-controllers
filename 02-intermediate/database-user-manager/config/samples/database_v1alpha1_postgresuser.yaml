apiVersion: database.example.com/v1alpha1
kind: PostgresUser
metadata:
  name: app-user
  namespace: default
spec:
  username: myapp
  database: myapp_db
  databases:
    - myapp_analytics
  engine: postgres
  host: postgres.default.svc.cluster.local
  port: 5432
  adminSecretRef:
    name: postgres-admin
  privileges:
    - SELECT
    - INSERT
    - UPDATE
    - DELETE
  roles:
    - pg_read_all_settings
  secretName: myapp-db-credentials
  rotatePassword: false
  rotationInterval: 720h
